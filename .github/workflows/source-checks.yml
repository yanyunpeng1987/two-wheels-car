name: Source checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify project references and memory layout
        run: python3 tools/verify_project.py
      - name: Verify Android management files and baseline manifest
        run: python3 tools/verify_android.py
      - name: Execute gamepad report and adapter regression tests
        run: |
          mkdir -p build/tests
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -IFirmware/Hiwonder/src Firmware/Hiwonder/src/gamepad_report.c \
            tests/gamepad_report_test.c -o build/tests/gamepad_report_test
          ./build/tests/gamepad_report_test
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Itests/stubs -IFirmware/Hiwonder/src \
            Firmware/Hiwonder/src/gamepad_report.c Firmware/Hiwonder/src/usbh_hid_gamepad.c \
            tests/gamepad_usb_adapter_test.c -o build/tests/gamepad_usb_adapter_test
          ./build/tests/gamepad_usb_adapter_test
      - name: Execute pickup protection and stop trace tests
        run: |
          mkdir -p build/tests
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -IFirmware/Hiwonder/inc Firmware/Hiwonder/src/pickup_accel_guard.c \
            tests/pickup_accel_guard_test.c -o build/tests/pickup_accel_guard_test
          ./build/tests/pickup_accel_guard_test
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -IFirmware/Hiwonder/inc Firmware/Hiwonder/src/control_stop_trace.c \
            tests/control_stop_trace_test.c -o build/tests/control_stop_trace_test
          ./build/tests/control_stop_trace_test
          python3 tests/control_guard_integration_test.py --cc gcc --output-dir build/tests/integration
          python3 tests/startup_safety_test.py --cc gcc --output-dir build/tests/startup
      - name: Execute battery filter and ADC regression tests
        run: |
          mkdir -p build/tests
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -IFirmware/Hiwonder/inc Firmware/Hiwonder/src/battery_monitor.c \
            tests/battery_monitor_test.c -o build/tests/battery_monitor_test
          ./build/tests/battery_monitor_test
          python3 tests/battery_adc_test.py --cc gcc --output-dir build/tests/battery-adc
      - name: Execute HC-05D UART framing and motion protection tests
        run: python3 tests/run_bluetooth_tests.py --cc gcc
      - name: Execute Android protocol and BLE state replay
        run: |
          python3 Android/MVTBOT/link/tests/run_protocol_tests.py --java-home "$JAVA_HOME"
          python3 Android/MVTBOT/link/tests/test_ble_session.py --java-home "$JAVA_HOME"
          python3 Android/MVTBOT/link/tests/test_health_recovery.py --java-home "$JAVA_HOME"
          python3 Android/MVTBOT/link/tests/test_manual_scanner.py --java-home "$JAVA_HOME"
          python3 Android/MVTBOT/link/tests/test_cross_stack_rearm.py --java-home "$JAVA_HOME" --cc gcc
          python3 Android/MVTBOT/link/tests/test_startup_subscriptions.py --java-home "$JAVA_HOME" --cc gcc
          python3 Android/MVTBOT/link/tests/test_dex_roundtrip.py
          python3 Android/MVTBOT/tools/test_ui_patch.py
      - name: Validate tool syntax and JSON files
        run: |
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          for path in [*Path('tools').glob('*.py'), *Path('Android/MVTBOT/tools').glob('*.py'), *Path('Android/MVTBOT/link/tests').glob('*.py'), *Path('Android/MVTBOT/changes/LINK-001').glob('*.py')]:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          paths = [*Path('.vscode').glob('*.json'), *Path('docs').rglob('*.json'), *Path('Android/MVTBOT/baseline').glob('*.json'), Path('BalanceCar.code-workspace')]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8-sig'))
          print('Python syntax and repository JSON checks passed.')
          PY
